<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="55%" r="75%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <pattern id="noise" width="180" height="180" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="30" r="1.2" fill="#ffffff" opacity="0.06"/>
      <circle cx="120" cy="80" r="1" fill="#ffffff" opacity="0.05"/>
      <circle cx="70" cy="150" r="1.3" fill="#ffffff" opacity="0.04"/>
      <circle cx="160" cy="40" r="1" fill="#ffffff" opacity="0.04"/>
      <circle cx="150" cy="150" r="1.1" fill="#ffffff" opacity="0.05"/>
      <circle cx="40" cy="120" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <rect width="1600" height="900" fill="url(#noise)" opacity="0.9"/>

  <!-- Abstract book shapes -->
  <g opacity="0.22" filter="url(#soft)">
    <path d="M260 640c70-26 154-18 220 14v38c-66-32-150-40-220-14z" fill="#a78bfa"/>
    <path d="M520 610c86-28 190-20 270 18v40c-80-38-184-46-270-18z" fill="#60a5fa"/>
    <path d="M850 635c78-22 170-12 240 18v38c-70-30-162-40-240-18z" fill="#34d399"/>
  </g>

  <g opacity="0.18">
    <path d="M1100 250c0-34 26-60 60-60h160c34 0 60 26 60 60v340c0 22-18 40-40 40h-180c-34 0-60-26-60-60z" fill="#ffffff"/>
    <path d="M1220 190v440" stroke="#0b1220" stroke-opacity="0.28" stroke-width="6"/>
    <path d="M1180 235h160" stroke="#0b1220" stroke-opacity="0.22" stroke-width="6"/>
    <path d="M1180 285h160" stroke="#0b1220" stroke-opacity="0.18" stroke-width="6"/>
    <path d="M1180 335h160" stroke="#0b1220" stroke-opacity="0.16" stroke-width="6"/>
  </g>

  <g opacity="0.12">
    <path d="M220 210c0-30 24-54 54-54h145c30 0 54 24 54 54v310c0 20-16 36-36 36H274c-30 0-54-24-54-54z" fill="#ffffff"/>
    <path d="M328 156v400" stroke="#0b1220" stroke-opacity="0.25" stroke-width="6"/>
  </g>

  <!-- Subtle bottom vignette -->
  <rect y="640" width="1600" height="260" fill="#000" opacity="0.12"/>
</svg>
